[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hevo-airflow-provider"
version = "1.0.0"
description = "Airflow provider for Hevo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "apache-airflow>=2.4.0",
    "aiohttp==3.13.2",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "coverage==7.4.1",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==0.25.2",
    "ruff==0.13.1",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = [
    "F", #"Pyflakes
    "E", # pycodestyle
    "C90", # "mccabe
    "I", # "isort
    "N", # "pep8-naming
    "D", # "pydocstyle
    "UP", # "pyupgrade
    "YTT", # "flake8-2020
    "ANN", # "flake8-annotations
    "ASYNC", # "flake8-async
    "S", # "flake8-bandit
    "BLE", # "flake8-blind-except
    "B", # "flake8-bugbear
    "A", # "flake8-builtins
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # Pylint
]

ignore = [
    "ANN002", "ANN003", "ANN204", "ANN401",
    "D100", "D104", "D106", "D107", "D205", "D211", "D212", "D401",
    "N818",
    "EM101", "EM102",
    "PLR2004",
    "PTH118",
    "S101", "S105", "S110", "S113", "S311", "S603", "S608",
    "BLE001",  # Allow catching Exception in hooks/triggers
    "SIM117",  # Allow nested with statements in tests
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore datetime timezone warnings in DAG examples (Airflow commonly uses naive datetime)
"dags/*.py" = ["DTZ001", "DTZ005", "PLC0415"]
# Ignore type annotations and unused arguments in tests (pytest fixtures)
"tests/**/*.py" = ["ANN001", "ANN201", "ARG002", "SLF001", "PLC0415"]
# Ignore unused context argument in operators/sensors (required by Airflow interface)
"src/airflow/hevo/operators/*.py" = ["ARG002"]
"src/airflow/hevo/sensors/*.py" = ["ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 10
max-statements = 100

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
check_untyped_defs = true
exclude = [
    "^\\.venv/.*$",
    "^\\.ruff_cache.*",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\(.*Protocol.*\\):",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true